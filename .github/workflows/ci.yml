name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Superseded PR pushes are pointless to finish, so cancel those. Never cancel on
# main: a run there is the record of whether that commit is good.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmt, clippy, the test suite and cargo-deny: .github/workflows/rust.yml, which the image
  # build (docker.yml) runs too.
  rust:
    uses: ./.github/workflows/rust.yml

  # The shim is Python and its image is only ever built on the deploy host, so
  # before this job a syntax error in app.py passed CI and was discovered when
  # the container failed to restart in production. compileall alone justifies
  # the two minutes; the gate tests cover the concurrency logic that decides
  # whether a play queues behind background prewarm.
  shim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q yt-dlp-shim

      - name: Install test dependencies
        run: pip install -r yt-dlp-shim/requirements-dev.txt

      - name: Gate tests
        run: pytest yt-dlp-shim/tests -q

  # The update helper runs as root on people's servers and is never built into
  # an image, so a mistake in it would surface only when someone presses Update
  # now. shellcheck catches the shell's traps; the test runs it against a
  # throwaway git origin with Docker faked.
  update-helper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck -S warning scripts/updater/*.sh

      - name: Update helper tests
        run: bash scripts/updater/test-updater.sh
