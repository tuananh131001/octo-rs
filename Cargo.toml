[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The release tag the dashboard shows. CARGO_PKG_VERSION cannot hold a leading zero
# (2026.10.03.2), so build.rs in the octo crate reads OCTO_VERSION, falling back to this.
version = "2026.10.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
octo-core = { path = "crates/octo-core" }
octo-subsonic = { path = "crates/octo-subsonic" }
octo-media = { path = "crates/octo-media" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23"
bytes = "1"
brotli = "8"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
httpdate = "1"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.11"
mime_guess = "2"
notify = "8"
parking_lot = "0.12"
percent-encoding = "2"
quick-xml = "0.42"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "gzip", "deflate", "rustls", "multipart", "form", "query", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Media
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
lofty = "0.25"
tiny-skia = "0.12"
cosmic-text = "0.19"

# Tests
insta = { version = "1", features = ["json"] }
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The port keeps the C# shapes where that makes the two easy to read side by side.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[profile.dev]
# Line tables only: enough for panics to name a line, and a fraction of the disk.
debug = "line-tables-only"

[profile.dev.package."*"]
# Cover rendering and image decoding are unbearably slow unoptimised, even in tests.
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
